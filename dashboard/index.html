<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DormMate 实时 Dashboard</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
    :root {
        --bg: #f1f5f9;
        --panel: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --ok: #16a34a;
        --warn: #f59e0b;
        --bad: #dc2626;
        --cold: #2563eb;
        --hot: #dc2626;
        --wet: #ea580c;
        --normal: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
    }

    h1 { font-size: 22px; margin: 0; }
    h1 small { font-size: 13px; color: var(--muted); font-weight: normal; margin-left: 8px; }

    .banner {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: bold;
        border: 1px solid transparent;
    }
    .banner::before {
        content: "";
        width: 9px; height: 9px;
        border-radius: 50%;
        background: currentColor;
    }
    .banner.ok   { color: var(--ok);   background: #dcfce7; border-color: #bbf7d0; }
    .banner.warn { color: var(--warn); background: #fef3c7; border-color: #fde68a; }
    .banner.bad  { color: var(--bad);  background: #fee2e2; border-color: #fecaca; }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 5px solid var(--muted);
        border-radius: 10px;
        padding: 16px;
        cursor: pointer;
        transition: box-shadow .15s, transform .15s;
    }
    .card:hover { box-shadow: 0 4px 14px rgba(15, 23, 42, .1); transform: translateY(-2px); }
    .card.active { box-shadow: 0 0 0 2px #93c5fd; }
    .card.stale { opacity: .55; }
    .card[data-status="正常"] { border-left-color: var(--normal); }
    .card[data-status="偏冷"] { border-left-color: var(--cold); }
    .card[data-status="偏热"] { border-left-color: var(--hot); }
    .card[data-status="偏湿"] { border-left-color: var(--wet); }

    .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .card-title .node-id { color: var(--muted); font-size: 12px; font-weight: normal; }

    .metric { display: flex; align-items: baseline; gap: 6px; margin: 6px 0; }
    .metric .value { font-size: 26px; font-weight: bold; font-variant-numeric: tabular-nums; }
    .metric .unit { font-size: 13px; color: var(--muted); }
    .metric .label { font-size: 13px; color: var(--muted); width: 34px; }

    .status-line { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .badge {
        padding: 3px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: bold;
        color: #fff;
        background: var(--muted);
    }
    .badge[data-status="正常"] { background: var(--normal); }
    .badge[data-status="偏冷"] { background: var(--cold); }
    .badge[data-status="偏热"] { background: var(--hot); }
    .badge[data-status="偏湿"] { background: var(--wet); }

    .stale-tag {
        display: none;
        font-size: 12px;
        color: var(--bad);
        font-weight: bold;
    }
    .card.stale .stale-tag { display: inline; }
    .card-time { margin-top: 8px; font-size: 12px; color: var(--muted); }

    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
    }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab {
        padding: 6px 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #f8fafc;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
    }
    .tab.active { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: bold; }

    .chart-box { position: relative; height: 320px; }

    .log-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    .log-head h2 { font-size: 15px; margin: 0; }
    .log-head span { font-size: 12px; color: var(--muted); }

    .log {
        height: 190px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #0f172a;
        padding: 8px 10px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.7;
    }
    .log-line { display: flex; gap: 10px; }
    .log-time { color: #64748b; flex: none; }
    .log-msg { word-break: break-all; }
    .log-info .log-msg { color: #cbd5e1; }
    .log-warn .log-msg { color: #fbbf24; }
    .log-error .log-msg { color: #f87171; }
    .log-ok .log-msg { color: #4ade80; }

    /* ===== 任务 A：异常优先级与处置 ===== */
    .priority-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 5px solid var(--warn);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }
    .priority-panel.none { border-left-color: var(--ok); }
    .priority-main { flex: 1; min-width: 280px; }
    .priority-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .priority-node { font-size: 20px; font-weight: bold; }
    .priority-reason { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
    .priority-side { text-align: right; }
    .event-count { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }

    .toolbar-btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        cursor: pointer;
    }
    .toolbar-btn:hover { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; }

    .phase-chip {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        background: #94a3b8;
    }
    .phase-chip[data-phase="attention"] { background: #f59e0b; }
    .phase-chip[data-phase="handling"]  { background: #2563eb; }
    .phase-chip[data-phase="recovered"] { background: #16a34a; }

    .task-a-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
    }

    .fan-btn {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
    }
    .fan-btn:not(:disabled):hover { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; }
    .fan-btn:disabled { opacity: .45; cursor: not-allowed; }

    .event-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .event-table th, .event-table td {
        border: 1px solid var(--border);
        padding: 6px 9px;
        text-align: left;
        vertical-align: top;
    }
    .event-table th { background: #f1f5f9; color: #475569; white-space: nowrap; }
    .event-table tr.ongoing td { background: #fffbeb; }
    .event-table .empty { color: var(--muted); text-align: center; padding: 14px; }

    /* ===== 任务 B：当前情况与判断依据 ===== */
    .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }
    .panel-head h2 { font-size: 15px; margin: 0; }

    .situation {
        font-size: 14px;
        line-height: 1.9;
        padding: 12px 14px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #334155;
    }
    .situation .ok { color: var(--ok); font-weight: bold; }
    .situation .warn-text { color: var(--bad); font-weight: bold; }

    .rank-list { margin-top: 14px; }
    .rank-item {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .rank-item.top { border-color: #f59e0b; background: #fffbeb; }
    .rank-no {
        width: 22px; height: 22px;
        border-radius: 50%;
        background: #94a3b8;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .rank-item.top .rank-no { background: #f59e0b; }
    .rank-node { font-weight: bold; min-width: 74px; }
    .rank-type { min-width: 46px; }
    .rank-dur, .rank-count { color: var(--muted); }
    .rank-basis { margin-left: auto; color: var(--muted); font-size: 12px; }
    .rank-empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }

    #toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translate(-50%, 20px);
        background: #1e293b;
        color: #f8fafc;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 8px 24px rgba(15, 23, 42, .3);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s, transform .25s;
        z-index: 100;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
    <h1>DormMate 实时 Dashboard <small>MQTT · ws://127.0.0.1:8083/mqtt</small></h1>
    <div class="banner warn" id="banner">正在连接 Broker…</div>
</header>

<div class="priority-panel none" id="priorityPanel">
    <div class="priority-main">
        <div class="priority-label">当前最需要关注的宿舍</div>
        <div class="priority-node" id="priorityNode">当前无异常宿舍</div>
        <div class="priority-reason" id="priorityReason">三个宿舍均处于正常状态</div>
    </div>
    <div class="priority-side">
        <button class="toolbar-btn" id="exportEventsBtn">导出事件日志</button>
        <span class="event-count" id="eventCount">已记录 0 条事件</span>
    </div>
</div>

<div class="panel">
    <div class="panel-head">
        <h2>当前情况</h2>
        <button class="toolbar-btn" id="ttsBtn">播放语音提醒</button>
    </div>
    <div class="situation" id="situationText">等待数据…</div>
    <div class="rank-list" id="rankList"></div>
</div>

<div class="cards" id="cards"></div>

<div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
</div>

<div class="panel">
    <div class="log-head">
        <h2>事件日志</h2>
        <span>最近 50 条 · 数据校验与连接状态</span>
    </div>
    <div class="log" id="log"></div>
</div>

<div class="panel">
    <div class="log-head">
        <h2>事件记录（任务 A）</h2>
        <span>最近 5 条 · 完整复盘见 analysis/report.html</span>
    </div>
    <table class="event-table" id="eventTable"></table>
</div>

<div id="toast"></div>

<script>
(function () {
    'use strict';

    // ---------- 常量 ----------
    var NODES = ['dorm-a', 'dorm-b', 'dorm-c'];
    var NODE_LABEL = { 'dorm-a': '宿舍 A', 'dorm-b': '宿舍 B', 'dorm-c': '宿舍 C' };
    var NODE_COLOR = { 'dorm-a': '#2563eb', 'dorm-b': '#16a34a', 'dorm-c': '#a855f7' };
    var VALID_STATUS = ['正常', '偏冷', '偏热', '偏湿'];
    var TOPIC_RE = /^dormmate\/([^/]+)\/env$/;
    var MAX_POINTS = 60;
    var MAX_LOG = 50;
    var STALE_MS = 10000;

    // ---------- 状态：每个节点一份独立数据，互不串号 ----------
    var state = {};
    NODES.forEach(function (id) {
        state[id] = {
            labels: [],
            temp: [],
            hum: [],
            temperature: null,
            humidity: null,
            status: '',
            lastUpdate: null
        };
    });
    var currentView = 'all';
    var chart = null;

    /* ===== 任务 A：异常优先级、处置状态机、事件日志 ===== */
    var PHASE_LABEL = {
        normal: '正常',
        attention: '仍需关注',
        handling: '处理中',
        recovered: '已恢复'
    };
    var EVENTS_KEY = 'dormmate_taskA_events';

    // 每个宿舍的处置状态：phase 是状态机当前态，episode 是进行中的异常段
    var taskA = {};
    NODES.forEach(function (id) {
        taskA[id] = {
            phase: 'normal',
            episode: null,
            anomalyCount: 0,
            newDataSinceAction: 0
        };
    });

    // 已完成的异常事件，持久化到 localStorage，刷新页面不丢
    var events = loadEvents();
    var priorityNode = null;
    var toastTimer = null;
    var mqttClient = null;

    var cardsEl = document.getElementById('cards');
    var tabsEl = document.getElementById('tabs');
    var logEl = document.getElementById('log');
    var bannerEl = document.getElementById('banner');
    var priorityPanelEl = document.getElementById('priorityPanel');
    var priorityNodeEl = document.getElementById('priorityNode');
    var priorityReasonEl = document.getElementById('priorityReason');
    var eventCountEl = document.getElementById('eventCount');
    var eventTableEl = document.getElementById('eventTable');
    var exportBtn = document.getElementById('exportEventsBtn');
    var toastEl = document.getElementById('toast');
    var situationEl = document.getElementById('situationText');
    var rankListEl = document.getElementById('rankList');
    var ttsBtn = document.getElementById('ttsBtn');

    // ---------- 通用工具 ----------
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function nowTime() {
        var d = new Date();
        return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function truncate(text, len) {
        text = String(text);
        return text.length > len ? text.slice(0, len) + '…' : text;
    }

    function log(level, text) {
        var line = document.createElement('div');
        line.className = 'log-line log-' + level;
        line.innerHTML = '<span class="log-time">' + nowTime() + '</span>' +
                         '<span class="log-msg">' + escapeHtml(text) + '</span>';
        logEl.insertBefore(line, logEl.firstChild);
        while (logEl.childNodes.length > MAX_LOG) {
            logEl.removeChild(logEl.lastChild);
        }
    }

    // 状态兜底规则，与 web/script.js 及 Publisher 保持一致（温度优先）
    function calcStatus(temp, hum) {
        if (temp < 18) return '偏冷';
        if (temp >= 30) return '偏热';
        if (hum >= 75) return '偏湿';
        return '正常';
    }

    function setBanner(kind, text) {
        bannerEl.className = 'banner ' + kind;
        bannerEl.textContent = text;
    }

    /* =========================================================
       任务 A：异常优先级判断 + 处置状态机 + 事件日志
       ========================================================= */

    function nowStamp() {
        var d = new Date();
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
            ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function fmtDuration(ms) {
        var total = Math.floor(ms / 1000);
        return pad(Math.floor(total / 60)) + ':' + pad(total % 60);
    }

    function loadEvents() {
        try {
            var raw = window.localStorage.getItem(EVENTS_KEY);
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
            return [];
        }
    }

    function saveEvents() {
        try {
            window.localStorage.setItem(EVENTS_KEY, JSON.stringify(events));
        } catch (err) {
            log('warn', '事件日志写入 localStorage 失败：' + err.message);
        }
    }

    function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
    }

    /* ---- A1：优先级判断（先比异常持续时间，长的优先；时长相同则比异常次数）---- */
    function recomputePriority() {
        var candidates = [];
        NODES.forEach(function (id) {
            var t = taskA[id];
            if (!t.episode) return;
            candidates.push({
                node: id,
                // 按秒取整：让几乎同时开始的异常段有机会触发"次数破平"规则
                durationSec: Math.floor((Date.now() - t.episode.startTs) / 1000),
                count: t.anomalyCount
            });
        });

        if (!candidates.length) {
            priorityNode = null;
            priorityPanelEl.className = 'priority-panel none';
            priorityNodeEl.textContent = '当前无异常宿舍';
            priorityReasonEl.textContent = '三个宿舍均处于正常状态';
            return;
        }

        candidates.sort(function (a, b) {
            if (b.durationSec !== a.durationSec) return b.durationSec - a.durationSec;
            return b.count - a.count;
        });

        var top = candidates[0];
        var tied = candidates.filter(function (c) { return c.durationSec === top.durationSec; }).length;

        var reason = '优先原因：异常持续 ' + fmtDuration(top.durationSec * 1000) +
            (tied > 1 ? '（并列最长）' : '（最长）') +
            '，异常 ' + top.count + ' 次' +
            (tied > 1 ? '（时长并列，取次数多者）' : '');

        priorityNode = top.node;
        priorityPanelEl.className = 'priority-panel';
        priorityNodeEl.textContent = NODE_LABEL[top.node] + '（' + top.node + '）';
        priorityReasonEl.textContent = reason + '　当前状态：' + PHASE_LABEL[taskA[top.node].phase];

        taskA[top.node].episode.priorityReason = reason;
    }

    /* ---- A3：状态机完全由 MQTT 新数据驱动，点击按钮绝不直接判恢复 ---- */
    function taskAOnData(nodeId, status, timeStr) {
        var t = taskA[nodeId];
        var stamp = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(timeStr || '')
            ? timeStr : nowStamp();

        if (status === '正常') {
            if (t.episode) {
                var ep = t.episode;
                events.push({
                    node: nodeId,
                    startTime: ep.startTime,
                    type: ep.type,
                    priorityReason: ep.priorityReason || '—',
                    userAction: ep.fanActionTime ? ('开启风扇 ' + ep.fanActionTime) : '无',
                    recoverTime: stamp,
                    result: '已恢复'
                });
                saveEvents();
                log('ok', nodeId + ' 数据恢复正常，事件已记录（' +
                    (ep.fanActionTime ? '期间开启过风扇' : '未人工干预') + '）');
                t.episode = null;
            }
            t.phase = 'recovered';
            t.newDataSinceAction = 0;
            return;
        }

        if (!t.episode) {
            t.episode = {
                startTs: Date.now(),
                startTime: stamp,
                type: status,
                fanActionTime: null,
                priorityReason: '—'
            };
            t.anomalyCount += 1;
            t.phase = 'attention';
            t.newDataSinceAction = 0;
            log('warn', nodeId + ' 出现异常：' + status + '（累计第 ' + t.anomalyCount + ' 次）');
        } else {
            t.episode.type = status;              // 异常类型变化，持续时间连续计算
            if (t.phase === 'handling') {
                t.newDataSinceAction += 1;        // 处理中持续收到新数据
            } else {
                t.phase = 'attention';
            }
        }
    }

    /* ---- A2：开启风扇（只把状态推到"处理中"，恢复仍由数据决定）---- */
    function startFan(nodeId) {
        var t = taskA[nodeId];
        if (!t.episode || t.phase !== 'attention') {
            showToast('当前状态不允许开启风扇');
            return;
        }

        var st = nowTime();
        t.episode.fanActionTime = st;
        t.phase = 'handling';
        t.newDataSinceAction = 0;

        if (mqttClient && mqttClient.connected) {
            mqttClient.publish('dormmate/' + nodeId + '/fan',
                JSON.stringify({ nodeId: nodeId, command: 'on', time: nowStamp() }));
            log('ok', nodeId + ' 已下发开启风扇命令 → dormmate/' + nodeId + '/fan');
        } else {
            log('error', nodeId + ' 开启风扇失败：MQTT 未连接');
        }

        showToast('处理中，风扇已开启（' + NODE_LABEL[nodeId] + '）');
        renderCard(nodeId);
        renderEvents();
        recomputePriority();
    }

    /* ---- A4：事件明细（已完成的 + 进行中的）---- */
    var EVENT_HEADERS = ['宿舍名称', '异常开始时间', '异常类型', '优先原因', '用户操作', '恢复时间', '最终结果'];

    function currentEventRows() {
        var rows = events.slice();
        NODES.forEach(function (id) {
            var t = taskA[id];
            if (!t.episode) return;
            rows.push({
                node: id,
                startTime: t.episode.startTime,
                type: t.episode.type,
                priorityReason: t.episode.priorityReason || '—',
                userAction: t.episode.fanActionTime ? ('开启风扇 ' + t.episode.fanActionTime) : '无',
                recoverTime: '—',
                result: t.phase === 'handling' ? '处理中未恢复' : '仍需关注未处理',
                ongoing: true,
                newData: t.newDataSinceAction
            });
        });
        return rows;
    }

    function renderEvents() {
        var rows = currentEventRows();
        eventCountEl.textContent = '已记录 ' + rows.length + ' 条事件';

        var html = '<tr>' + EVENT_HEADERS.map(function (h) {
            return '<th>' + escapeHtml(h) + '</th>';
        }).join('') + '</tr>';

        if (!rows.length) {
            html += '<tr><td class="empty" colspan="' + EVENT_HEADERS.length + '">暂无事件记录</td></tr>';
        } else {
            rows.slice(-5).reverse().forEach(function (r) {
                var result = r.result;
                if (r.ongoing && r.newData) result += '（已收到 ' + r.newData + ' 组新数据）';
                html += '<tr' + (r.ongoing ? ' class="ongoing"' : '') + '>' +
                    '<td>' + escapeHtml(r.node) + '</td>' +
                    '<td>' + escapeHtml(r.startTime) + '</td>' +
                    '<td>' + escapeHtml(r.type) + '</td>' +
                    '<td>' + escapeHtml(r.priorityReason) + '</td>' +
                    '<td>' + escapeHtml(r.userAction) + '</td>' +
                    '<td>' + escapeHtml(r.recoverTime) + '</td>' +
                    '<td>' + escapeHtml(result) + '</td></tr>';
            });
        }
        eventTableEl.innerHTML = html;
    }

    function csvCell(value) {
        var s = String(value == null ? '' : value);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportEvents() {
        var rows = currentEventRows();
        if (!rows.length) {
            showToast('暂无事件记录可导出');
            return;
        }
        var csv = EVENT_HEADERS.join(',') + '\n';
        rows.forEach(function (r) {
            csv += [r.node, r.startTime, r.type, r.priorityReason,
                    r.userAction, r.recoverTime, r.result].map(csvCell).join(',') + '\n';
        });

        var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'events.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        log('info', '已导出事件日志 events.csv（' + rows.length + ' 条）');
        showToast('已导出 events.csv（' + rows.length + ' 条）');
    }

    /* =========================================================
       任务 B：当前情况描述（B1）、判断依据排名（B2）、语音提醒（B4）
       所有文字均由实时数据拼装，没有写死的句子
       ========================================================= */

    // 按优先级排序的异常宿舍（时长优先，时长相同比次数）—— B1/B2/TTS 共用
    function buildRankItems() {
        var items = [];
        NODES.forEach(function (id) {
            var t = taskA[id];
            if (!t.episode) return;
            items.push({
                node: id,
                type: t.episode.type,
                durationSec: Math.floor((Date.now() - t.episode.startTs) / 1000),
                count: t.anomalyCount,
                phase: t.phase
            });
        });
        items.sort(function (a, b) {
            if (b.durationSec !== a.durationSec) return b.durationSec - a.durationSec;
            return b.count - a.count;
        });
        return items;
    }

    /* ---- B1：一句话说清"当前发生的情况" ---- */
    function renderSituation() {
        var withData = NODES.filter(function (id) { return state[id].status !== ''; });
        if (!withData.length) {
            situationEl.textContent = '等待数据…';
            return;
        }

        var abnormal = withData.filter(function (id) { return taskA[id].episode; });

        if (!abnormal.length) {
            var brief = withData.map(function (id) {
                var s = state[id];
                return NODE_LABEL[id] + ' ' + s.temperature.toFixed(1) + '℃ / ' +
                    s.humidity.toFixed(1) + '%';
            }).join('　');
            situationEl.innerHTML = '<span class="ok">三个宿舍环境均正常，无需关注。</span>　' +
                escapeHtml(brief);
            return;
        }

        var parts = abnormal.map(function (id) {
            var t = taskA[id];
            var s = state[id];
            var metric = t.episode.type === '偏湿'
                ? s.humidity.toFixed(1) + '%'
                : s.temperature.toFixed(1) + '℃';
            return '<span class="warn-text">' + NODE_LABEL[id] + '</span> ' +
                escapeHtml(t.episode.type) + '（' + metric + '），已持续 ' +
                fmtDuration(Date.now() - t.episode.startTs) +
                '，今日第 ' + t.anomalyCount + ' 次，当前' + PHASE_LABEL[t.phase];
        });

        var normalIds = withData.filter(function (id) { return !taskA[id].episode; });
        var tail = normalIds.length
            ? '　' + normalIds.map(function (id) { return NODE_LABEL[id]; }).join('、') + ' 正常。'
            : '';

        situationEl.innerHTML = '当前有 ' + abnormal.length + ' 个宿舍处于异常：' +
            parts.join('；') + '。' + tail;
    }

    /* ---- B2：优先宿舍的判断依据（时长 / 次数）---- */
    function renderRank() {
        var items = buildRankItems();
        if (!items.length) {
            rankListEl.innerHTML = '<div class="rank-empty">当前没有需要排序的异常宿舍</div>';
            return;
        }

        var html = '';
        items.forEach(function (it, i) {
            var tied = items.filter(function (o) { return o.durationSec === it.durationSec; }).length > 1;
            var basis;
            if (i === 0) {
                basis = '判断依据：持续 ' + fmtDuration(it.durationSec * 1000) +
                    (tied ? '（并列最长）' : '（最长）') + '，异常 ' + it.count + ' 次' +
                    (tied ? '（并列时取次数多者）' : '');
            } else {
                basis = '持续 ' + fmtDuration(it.durationSec * 1000) + '，异常 ' + it.count + ' 次';
            }
            html += '<div class="rank-item' + (i === 0 ? ' top' : '') + '">' +
                '<span class="rank-no">' + (i + 1) + '</span>' +
                '<span class="rank-node">' + NODE_LABEL[it.node] + '</span>' +
                '<span class="rank-type">' + escapeHtml(it.type) + '</span>' +
                '<span class="rank-dur">异常持续 ' + fmtDuration(it.durationSec * 1000) + '</span>' +
                '<span class="rank-count">异常 ' + it.count + ' 次</span>' +
                '<span class="rank-basis">' + escapeHtml(basis) + '　' + PHASE_LABEL[it.phase] + '</span>' +
                '</div>';
        });
        rankListEl.innerHTML = html;
    }

    /* ---- B4：语音提醒只朗读"当前提醒"，文案同样由数据自动生成 ---- */
    function buildReminderSpeech() {
        var items = buildRankItems();
        if (!items.length) {
            return '三个宿舍环境均正常，无需关注。';
        }

        var top = items[0];
        var mins = Math.floor(top.durationSec / 60);
        var secs = top.durationSec % 60;
        var durText = mins > 0 ? mins + ' 分 ' + secs + ' 秒' : secs + ' 秒';

        var text = '当前最需要关注的宿舍是' + NODE_LABEL[top.node] + '：' + top.type +
            '，已持续 ' + durText + '，这是今日第 ' + top.count + ' 次异常。';

        var others = items.slice(1);
        if (others.length) {
            text += others.map(function (o) {
                var m = Math.floor(o.durationSec / 60);
                return NODE_LABEL[o.node] + ' ' + o.type + '，已持续 ' +
                    (m > 0 ? m + ' 分钟' : o.durationSec + ' 秒');
            }).join('；') + '。';
        }

        var normalIds = NODES.filter(function (id) { return !taskA[id].episode; });
        if (normalIds.length) {
            text += normalIds.map(function (id) { return NODE_LABEL[id]; }).join('、') + ' 正常。';
        }
        return text;
    }

    function speakReminder() {
        if (!('speechSynthesis' in window)) {
            showToast('当前浏览器不支持语音合成');
            return;
        }
        var text = buildReminderSpeech();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        log('info', '语音提醒：' + text);
        showToast('正在朗读当前提醒');
    }

    // ---------- 卡片渲染 ----------
    function buildCards() {
        NODES.forEach(function (id) {
            var card = document.createElement('div');
            card.className = 'card';
            card.id = 'card-' + id;
            card.innerHTML =
                '<div class="card-title"><span>' + NODE_LABEL[id] + '</span>' +
                '<span class="node-id">' + id + '</span></div>' +
                '<div class="metric"><span class="label">温度</span>' +
                '<span class="value temp">--</span><span class="unit">℃</span></div>' +
                '<div class="metric"><span class="label">湿度</span>' +
                '<span class="value humid">--</span><span class="unit">%</span></div>' +
                '<div class="status-line"><span class="badge status">等待数据</span>' +
                '<span class="stale-tag">数据超时</span></div>' +
                '<div class="card-time">最后更新：--</div>' +
                '<div class="task-a-line"><span class="phase-chip" data-phase="normal">正常</span>' +
                '<span class="anomaly-info">累计异常 0 次</span></div>' +
                '<button class="fan-btn" disabled>开启风扇</button>';
            card.addEventListener('click', function () { switchView(id); });
            card.querySelector('.fan-btn').addEventListener('click', function (e) {
                e.stopPropagation();   // 不要连带触发卡片的"切换视图"
                startFan(id);
            });
            cardsEl.appendChild(card);
        });
    }

    function renderCard(id) {
        var s = state[id];
        var card = document.getElementById('card-' + id);
        if (!card) return;
        if (s.status) {
            card.setAttribute('data-status', s.status);
            card.querySelector('.status').setAttribute('data-status', s.status);
            card.querySelector('.status').textContent = s.status;
        }
        card.querySelector('.temp').textContent = s.temperature === null ? '--' : s.temperature.toFixed(1);
        card.querySelector('.humid').textContent = s.humidity === null ? '--' : s.humidity.toFixed(1);
        card.querySelector('.card-time').textContent = '最后更新：' +
            (s.lastUpdate ? new Date(s.lastUpdate).toTimeString().slice(0, 8) : '--');

        // ---- 任务 A：处置状态与风扇按钮 ----
        var t = taskA[id];
        var chip = card.querySelector('.phase-chip');
        chip.setAttribute('data-phase', t.phase);
        chip.textContent = PHASE_LABEL[t.phase];

        var info = card.querySelector('.anomaly-info');
        if (t.episode) {
            info.textContent = '异常持续 ' + fmtDuration(Date.now() - t.episode.startTs) +
                ' · 累计 ' + t.anomalyCount + ' 次' +
                (t.phase === 'handling' ? ' · 新数据 ' + t.newDataSinceAction + ' 组' : '');
        } else {
            info.textContent = '累计异常 ' + t.anomalyCount + ' 次';
        }

        var btn = card.querySelector('.fan-btn');
        btn.disabled = t.phase !== 'attention';
        btn.textContent = t.phase === 'handling' ? '风扇已开启（处理中）'
            : (t.phase === 'recovered' ? '已恢复' : '开启风扇');

        card.classList.toggle('active', currentView === id);
    }

    function checkStale() {
        var now = Date.now();
        NODES.forEach(function (id) {
            var s = state[id];
            var stale = s.lastUpdate !== null && (now - s.lastUpdate) > STALE_MS;
            var card = document.getElementById('card-' + id);
            if (card) card.classList.toggle('stale', stale);
        });
    }

    // ---------- 图表 ----------
    function alignSeries(arr, len) {
        if (arr.length === len) return arr.slice();
        return new Array(len - arr.length).fill(null).concat(arr);
    }

    function chartData() {
        if (currentView === 'all') {
            var ref = NODES.reduce(function (a, b) {
                return state[a].labels.length >= state[b].labels.length ? a : b;
            });
            var len = state[ref].labels.length;
            return {
                labels: state[ref].labels.slice(),
                datasets: NODES.map(function (id) {
                    return {
                        label: NODE_LABEL[id] + ' 温度',
                        data: alignSeries(state[id].temp, len),
                        borderColor: NODE_COLOR[id],
                        backgroundColor: NODE_COLOR[id],
                        tension: 0.3,
                        pointRadius: 0,
                        borderWidth: 2
                    };
                })
            };
        }
        var s = state[currentView];
        return {
            labels: s.labels.slice(),
            datasets: [
                { label: '温度 (℃)', data: s.temp.slice(), borderColor: '#ef4444',
                  tension: 0.3, pointRadius: 0, borderWidth: 2, yAxisID: 'y' },
                { label: '湿度 (%)', data: s.hum.slice(), borderColor: '#3b82f6',
                  tension: 0.3, pointRadius: 0, borderWidth: 2, yAxisID: 'y1' }
            ]
        };
    }

    function chartOptions() {
        var options = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 14, font: { size: 12 } } },
                title: {
                    display: true,
                    text: currentView === 'all'
                        ? '全部宿舍 · 温度趋势（最近 ' + MAX_POINTS + ' 个采样点）'
                        : NODE_LABEL[currentView] + ' · 温湿度趋势（最近 ' + MAX_POINTS + ' 个采样点）',
                    font: { size: 13 },
                    color: '#475569'
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 11 } } },
                y: { title: { display: true, text: '温度 (℃)' }, suggestedMin: 15, suggestedMax: 33 }
            }
        };
        if (currentView !== 'all') {
            options.scales.y1 = {
                position: 'right',
                title: { display: true, text: '湿度 (%)' },
                suggestedMin: 40,
                suggestedMax: 90,
                grid: { drawOnChartArea: false }
            };
        }
        return options;
    }

    // 切换视图时整体重建，避免双轴配置残留在单轴视图上
    function buildChart() {
        if (chart) { chart.destroy(); chart = null; }
        chart = new Chart(document.getElementById('chart'), {
            type: 'line',
            data: chartData(),
            options: chartOptions()
        });
    }

    function refreshChart() {
        if (!chart) { buildChart(); return; }
        var d = chartData();
        chart.data.labels = d.labels;
        chart.data.datasets.forEach(function (ds, i) { ds.data = d.datasets[i].data; });
        chart.update('none');
    }

    // ---------- 视图切换 ----------
    function buildTabs() {
        var views = ['all'].concat(NODES);
        views.forEach(function (v) {
            var btn = document.createElement('button');
            btn.className = 'tab';
            btn.textContent = v === 'all' ? '全部宿舍' : NODE_LABEL[v];
            btn.addEventListener('click', function () { switchView(v); });
            tabsEl.appendChild(btn);
        });
    }

    function switchView(view) {
        currentView = view;
        Array.prototype.forEach.call(tabsEl.children, function (btn, i) {
            var v = i === 0 ? 'all' : NODES[i - 1];
            btn.classList.toggle('active', v === currentView);
        });
        NODES.forEach(renderCard);
        buildChart();
    }

    // ---------- 数据更新 ----------
    function updateNode(nodeId, temp, hum, status, timeStr) {
        var s = state[nodeId];
        s.temperature = temp;
        s.humidity = hum;
        s.status = status;
        s.lastUpdate = Date.now();

        var label = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(timeStr)
            ? timeStr.slice(11)
            : nowTime();

        s.labels.push(label);
        s.temp.push(temp);
        s.hum.push(hum);
        if (s.labels.length > MAX_POINTS) {
            s.labels.shift();
            s.temp.shift();
            s.hum.shift();
        }

        // 任务 A：先按新数据推进状态机，再渲染（卡片状态依赖 taskA）
        taskAOnData(nodeId, status, timeStr);
        renderCard(nodeId);
        recomputePriority();
        renderEvents();
        renderSituation();
        renderRank();
        checkStale();
        refreshChart();
    }

    // ---------- 消息校验：任何非法数据只记日志，绝不让页面崩溃 ----------
    function handleMessage(topic, payloadBuffer) {
        var raw = payloadBuffer.toString();

        var data;
        try {
            data = JSON.parse(raw);
        } catch (err) {
            log('error', '非法 JSON，已忽略 | topic=' + topic + ' | payload=' + truncate(raw, 60));
            return;
        }

        var matched = topic.match(TOPIC_RE);
        if (!matched) {
            log('error', 'Topic 格式不正确，已忽略 | ' + topic);
            return;
        }

        var topicNode = matched[1];
        if (NODES.indexOf(topicNode) === -1) {
            log('error', '未知节点，已忽略 | ' + topic);
            return;
        }
        if (!data || typeof data !== 'object' || NODES.indexOf(data.nodeId) === -1) {
            log('error', 'nodeId 非法，已忽略 | topic=' + topic +
                ' | nodeId=' + truncate(JSON.stringify(data && data.nodeId), 30));
            return;
        }
        if (data.nodeId !== topicNode) {
            log('error', 'Topic 与 nodeId 不一致，已忽略 | topic=' + topic + ' | nodeId=' + data.nodeId);
            return;
        }

        var temp = Number(data.temperature);
        var hum = Number(data.humidity);
        if (!isFinite(temp) || !isFinite(hum)) {
            log('error', '温湿度不是有效数值，已忽略 | ' + truncate(raw, 60));
            return;
        }

        var status = data.status;
        if (VALID_STATUS.indexOf(status) === -1) {
            status = calcStatus(temp, hum);
            log('warn', 'status 缺失或非法，已按规则重算 | ' + data.nodeId + ' -> ' + status);
        }

        updateNode(data.nodeId, temp, hum, status, data.time);
    }

    // ---------- MQTT 连接 ----------
    function connect() {
        var client = mqtt.connect('ws://127.0.0.1:8083/mqtt', {
            clientId: 'dormmate-dashboard-' + Math.random().toString(16).slice(2, 8),
            connectTimeout: 4000,
            reconnectPeriod: 2000,
            keepalive: 60,
            clean: true
        });
        mqttClient = client;   // 供"开启风扇"按钮发布命令使用

        client.on('connect', function () {
            setBanner('ok', '已连接 Broker');
            log('ok', '已连接到 ws://127.0.0.1:8083/mqtt');
            // 订阅超集 Topic，才能收到并演示"Topic 写错"的消息
            client.subscribe('dormmate/#', function (err) {
                if (err) {
                    log('error', '订阅失败：' + err.message);
                } else {
                    log('info', '已订阅 dormmate/#（仅处理 dormmate/<nodeId>/env）');
                }
            });
        });

        client.on('message', function (topic, message) {
            try {
                handleMessage(topic, message);
            } catch (err) {
                log('error', '处理消息时出错（已捕获）：' + err.message);
            }
        });

        client.on('reconnect', function () {
            setBanner('warn', '正在重连…');
        });

        client.on('close', function () {
            setBanner('bad', '连接已断开（自动重连中）');
            log('warn', '连接断开，等待自动重连…');
        });

        client.on('offline', function () {
            setBanner('bad', 'Broker 离线（自动重连中）');
        });

        client.on('error', function (err) {
            setBanner('bad', '连接错误（自动重连中）');
            log('error', '连接错误：' + err.message);
        });
    }

    // ---------- 初始化 ----------
    buildCards();
    buildTabs();
    switchView('all');
    NODES.forEach(renderCard);
    recomputePriority();
    renderEvents();
    renderSituation();
    renderRank();
    exportBtn.addEventListener('click', exportEvents);
    ttsBtn.addEventListener('click', speakReminder);

    // 每秒刷新：异常持续时间随钟表增长，没有新数据时也要更新显示
    setInterval(function () {
        checkStale();
        recomputePriority();
        renderEvents();
        renderSituation();
        renderRank();
        NODES.forEach(renderCard);
    }, 1000);

    log('info', '页面已加载，开始连接 Broker…');
    log('info', '任务 A：异常优先级判断 / 开启风扇闭环 / 事件日志 已启用');
    connect();
})();
</script>
