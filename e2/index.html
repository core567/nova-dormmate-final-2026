<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DormMate 语音交互与现场快照（E2）</title>
<!--
  任务 E2：ASR 语音指令 + TTS 朗读 + Camera 现场快照
  独立页面，不改动 D 模块与 3D 页面。

  打开方式（摄像头与麦克风需要安全上下文）：
    在项目根目录执行  python -m http.server 8000
    浏览器访问          http://localhost:8000/e2/index.html
-->
<!-- 依赖本地化到 ../libs/，不依赖 CDN -->
<script src="../libs/mqtt.min.js"></script>
<!-- 统一消息协议与数据校验（单一来源，四端共用） -->
<script src="../shared/protocol.js"></script>
<!-- DormMate Design System（品牌与状态色统一口径） -->
<link rel="stylesheet" href="../shared/design-system.css">
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 20px 24px 60px;
        background: #f1f5f9;
        color: #1e293b;
        font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }

    .banner {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 5px 14px; border-radius: 999px;
        font-size: 13px; font-weight: bold; margin-bottom: 18px;
    }
    .banner::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    .banner.ok   { color: #15803d; background: #dcfce7; }
    .banner.warn { color: #b45309; background: #fef3c7; }
    .banner.bad  { color: #b91c1c; background: #fee2e2; }

    .panel {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 16px 18px; margin-bottom: 16px;
    }
    .panel h2 { font-size: 14px; margin: 0 0 12px; color: #475569; }

    button {
        font-family: inherit; font-size: 13px; font-weight: bold;
        padding: 8px 16px; border-radius: 8px;
        border: 1px solid #cbd5e1; background: #f8fafc; color: #334155;
        cursor: pointer;
    }
    button:hover:not(:disabled) { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.active { background: #2563eb; border-color: #2563eb; color: #fff; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .card {
        display: flex; gap: 32px; align-items: baseline;
        padding: 14px 16px; background: #f8fafc;
        border: 1px solid #e2e8f0; border-radius: 10px;
    }
    .card .node { font-size: 16px; font-weight: bold; }
    .card .metric { font-size: 13px; color: #64748b; }
    .card .metric b { font-size: 22px; color: #1e293b; margin: 0 2px; }
    .card .status {
        padding: 3px 12px; border-radius: 999px;
        font-size: 13px; font-weight: bold; color: #fff; background: #94a3b8;
    }
    .card .status[data-status="正常"] { background: var(--dm-normal); }
    .card .status[data-status="偏热"] { background: var(--dm-hot); }
    .card .status[data-status="偏湿"] { background: var(--dm-wet); }
    .card .status[data-status="偏冷"] { background: var(--dm-cold); }

    /* ---------- 现场助手（DormMate Field Assistant）布局 ---------- */
    .fa-hero-body {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 16px;
    }
    .fa-hero-node { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
    .fa-hero-label {
        font-family: var(--dm-font-mono);
        font-size: 11px; letter-spacing: 1.4px; color: var(--dm-accent);
    }
    .fa-hero-name { font-size: 26px; font-weight: 700; color: var(--dm-text-strong); }
    .fa-hero-metrics { display: flex; gap: 32px; flex-wrap: wrap; }
    .fa-hero-metrics .dm-metric__value { font-size: 34px; }

    /* 语音状态：现场助手里最需要一眼看到的信息 */
    .fa-asr-state {
        display: flex; align-items: center; gap: 10px;
        font-size: 15px; font-weight: 700;
        padding: 11px 14px; border-radius: 10px;
        background: var(--dm-slate-50); border: 1px solid var(--dm-border);
        color: var(--dm-text);
        transition: background .2s, border-color .2s, color .2s;
    }
    .fa-asr-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dm-slate-400); flex: none; }
    .fa-asr-state[data-state="listening"] { background: #fef2f2; border-color: #fecaca; color: var(--dm-hot); }
    .fa-asr-state[data-state="listening"] .fa-asr-dot { background: var(--dm-hot); animation: fa-pulse 1s infinite; }
    .fa-asr-state[data-state="starting"] { background: var(--dm-ice-100); border-color: var(--dm-ice-400); color: var(--dm-ice-600); }
    .fa-asr-state[data-state="starting"] .fa-asr-dot { background: var(--dm-ice-500); animation: fa-pulse 1s infinite; }
    .fa-asr-state[data-state="error"] { background: var(--dm-cold-soft); border-color: #fde68a; color: #b45309; }
    .fa-asr-state[data-state="error"] .fa-asr-dot { background: var(--dm-cold); }
    .fa-asr-state[data-state="unsupported"] .fa-asr-dot { background: var(--dm-slate-400); }
    @keyframes fa-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .22; } }

    .fa-asr-heard {
        font-size: 13px; color: var(--dm-ice-600);
        min-height: 20px; margin-top: 10px;
        font-family: var(--dm-font-mono);
    }

    .hint { font-size: 12px; color: #64748b; line-height: 1.8; }
    .hint code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px; color: #0369a1; }

    #asrStatus { font-size: 13px; font-weight: bold; color: #475569; }
    #asrHeard { font-size: 13px; color: #0369a1; min-height: 20px; }

    /* ASR 状态机：按钮与状态文字随状态变色，错误态要一眼看得出 */
    #asrBtn.active { background: #dc2626; border-color: #dc2626; color: #fff; }
    #asrBtn.error { background: #f59e0b; border-color: #f59e0b; color: #fff; }
    #asrStatus[data-state="listening"] { color: #dc2626; }
    #asrStatus[data-state="starting"] { color: #0369a1; }
    #asrStatus[data-state="error"] { color: #b45309; }
    #asrStatus[data-state="unsupported"] { color: #64748b; }

    #video { width: 320px; border-radius: 10px; background: #0f172a; display: block; margin-top: 12px; }
    #canvas { display: none; }

    .snap-list { list-style: none; padding: 0; margin: 0; }
    .snap-list li {
        padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
        margin-bottom: 8px; font-size: 13px; line-height: 1.6;
    }
    .snap-list .sid { font-weight: bold; color: #2563eb; }
    .snap-list .sdesc { color: #64748b; }
    .snap-empty { color: #94a3b8; font-size: 13px; }

    #log {
        height: 140px; overflow-y: auto; background: #0f172a; border-radius: 8px;
        padding: 10px 12px; font-family: Consolas, "Courier New", monospace;
        font-size: 12px; line-height: 1.7;
    }
    .log-line { display: flex; gap: 10px; }
    .log-time { color: #64748b; flex: none; }
    .log-msg { word-break: break-all; color: #cbd5e1; }
    .log-ok .log-msg { color: #4ade80; }
    .log-warn .log-msg { color: #fbbf24; }
    .log-error .log-msg { color: #f87171; }
</style>
</head>
<body>

<h1 class="dm-brand-title">DormMate
    <span class="dm-brand-sub">Field Assistant</span>
</h1>
<div class="sub">现场助手 · 语音指令 / 状态朗读 / 现场快照</div>

<div class="banner warn" id="banner">正在连接 Broker…</div>

<!-- 现场态势：当前宿舍 + 实时温湿度 + 状态 -->
<div class="panel">
    <div class="dm-panel-title">
        <h2>当前宿舍</h2>
        <span class="dm-panel-note" id="cardTime">数据时间 —</span>
    </div>
    <div class="row">
        <button class="active" data-node="dorm-a">宿舍 A</button>
        <button data-node="dorm-b">宿舍 B</button>
        <button data-node="dorm-c">宿舍 C</button>
    </div>
    <div class="fa-hero-body">
        <div class="fa-hero-node">
            <div class="fa-hero-label">NODE</div>
            <div class="fa-hero-name" id="cardNode">宿舍 A</div>
            <span class="dm-status" id="cardStatus" data-status="">等待数据</span>
        </div>
        <div class="fa-hero-metrics">
            <div class="dm-metric">
                <span class="dm-metric__label">TEMP · 温度</span>
                <span class="dm-metric__value"><span id="cardTemp">--</span><span class="dm-metric__unit">℃</span></span>
            </div>
            <div class="dm-metric">
                <span class="dm-metric__label">HUMID · 湿度</span>
                <span class="dm-metric__value"><span id="cardHumid">--</span><span class="dm-metric__unit">%</span></span>
            </div>
        </div>
    </div>
</div>

<!-- 语音交互 -->
<div class="panel">
    <div class="dm-panel-title">
        <h2>语音助手</h2>
        <span class="dm-panel-note">语音与按钮调用同一套业务函数，行为完全一致</span>
    </div>
    <div class="fa-asr-state" id="asrStateBox" data-state="idle">
        <span class="fa-asr-dot"></span>
        <span id="asrStatus">语音待机</span>
    </div>
    <div class="fa-asr-heard" id="asrHeard">最近识别：—</div>
    <div class="row" style="margin-top:14px;">
        <button id="asrBtn">🎤 开始语音指令</button>
        <button id="speakBtn">🔊 朗读状态</button>
        <button id="cameraBtn">📷 开启摄像头</button>
        <button id="snapBtn" disabled>📸 拍照并保存快照</button>
    </div>
    <div class="hint" style="margin-top:12px;">
        可用语音指令：<code>切换到宿舍A</code> <code>切换到宿舍B</code> <code>切换到宿舍C</code>
        <code>朗读状态</code> <code>拍照</code><br>
        识别置信度偏低时会先弹确认框再执行；语音识别不可用时，上方按钮可完成全部同样的操作。
    </div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<!-- 快照记录 -->
<div class="panel">
    <h2>现场快照记录（含 nodeId / 时间 / 事件描述）</h2>
    <ul class="snap-list" id="snapList"></ul>
    <div class="row" style="margin-top:10px;">
        <button id="clearSnapBtn">清空记录</button>
    </div>
</div>

<!-- 操作日志 -->
<div class="panel">
    <h2>操作日志</h2>
    <div id="log"></div>
</div>

<script>
(function () {
    'use strict';

    /* ============================================================
       常量
       ============================================================ */
    var P = window.DormMateProtocol;
    var NODES = P.NODES;
    var NODE_LABEL = { 'dorm-a': '宿舍 A', 'dorm-b': '宿舍 B', 'dorm-c': '宿舍 C' };
    var BROKER_WS = 'ws://127.0.0.1:8083/mqtt';
    var SNAP_KEY = 'dormmate_e2_snapshots';
    var MAX_LOG = 60;

    // 每个节点最近一次收到的 seq：旧消息直接丢弃
    var lastSeq = {};
    NODES.forEach(function (id) { lastSeq[id] = null; });

    /* ============================================================
       状态
       ============================================================ */
    var currentNode = 'dorm-a';
    var liveData = {};          // nodeId -> { temperature, humidity, status, time }
    NODES.forEach(function (id) { liveData[id] = null; });

    var client = null;
    var stream = null;
    var recognition = null;
    var snapshots = loadSnapshots();

    /* ============================================================
       工具
       ============================================================ */
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function nowTime() {
        var d = new Date();
        return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function formatStamp(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
            ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function fileStamp(d) {
        return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
            pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
    }

    function escapeHtml(text) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function log(level, text) {
        var line = document.createElement('div');
        line.className = 'log-line log-' + level;
        line.innerHTML = '<span class="log-time">' + nowTime() + '</span>' +
                         '<span class="log-msg">' + escapeHtml(text) + '</span>';
        logEl.insertBefore(line, logEl.firstChild);
        while (logEl.childNodes.length > MAX_LOG) logEl.removeChild(logEl.lastChild);
    }

    function setBanner(kind, text) {
        bannerEl.className = 'banner ' + kind;
        bannerEl.textContent = text;
    }

    /* ============================================================
       DOM
       ============================================================ */
    var bannerEl = document.getElementById('banner');
    var cardNodeEl = document.getElementById('cardNode');
    var cardTempEl = document.getElementById('cardTemp');
    var cardHumidEl = document.getElementById('cardHumid');
    var cardStatusEl = document.getElementById('cardStatus');
    var cardTimeEl = document.getElementById('cardTime');
    var asrBtn = document.getElementById('asrBtn');
    var asrStatusEl = document.getElementById('asrStatus');
    var asrStateBoxEl = document.getElementById('asrStateBox');
    var asrHeardEl = document.getElementById('asrHeard');
    var speakBtn = document.getElementById('speakBtn');
    var cameraBtn = document.getElementById('cameraBtn');
    var snapBtn = document.getElementById('snapBtn');
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var snapListEl = document.getElementById('snapList');
    var clearSnapBtn = document.getElementById('clearSnapBtn');
    var logEl = document.getElementById('log');
    var nodeButtons = document.querySelectorAll('[data-node]');

    /* ============================================================
       MQTT：订阅三个宿舍的实时数据（与 Dashboard 同样的校验方式）
       ============================================================ */
    function connect() {
        if (client) return;
        // mqtt.js 来自 CDN，加载失败时只跳过实时数据，
        // 语音、拍照、按钮这些不依赖 MQTT 的功能必须照常可用
        if (typeof mqtt === 'undefined') {
            setBanner('bad', '未能加载 mqtt.js（请确认 libs/ 目录完整）；语音与拍照仍可使用');
            log('error', 'mqtt.js 未加载，已跳过 MQTT 连接');
            return;
        }
        setBanner('warn', '正在连接 Broker…');

        client = mqtt.connect(BROKER_WS, {
            clientId: 'dormmate-e2-' + Math.random().toString(16).slice(2, 8),
            connectTimeout: 4000,
            reconnectPeriod: 2000,
            keepalive: 60,
            clean: true
        });

        client.on('connect', function () {
            setBanner('ok', '已连接 Broker');
            log('ok', '已连接 ' + BROKER_WS);
            client.subscribe('dormmate/#', function (err) {
                if (err) log('error', '订阅失败：' + err.message);
                else log('info', '已订阅 dormmate/#（env / fan / sim / focus 统一路由）');
            });
        });

        client.on('message', function (topic, message) {
            try {
                routeMessage(topic, message);
            } catch (err) {
                log('error', '处理消息出错（已捕获）：' + err.message);
            }
        });

        client.on('close', function () { setBanner('bad', '连接已断开（自动重连中）'); });
        client.on('offline', function () { setBanner('bad', 'Broker 离线（自动重连中）'); });
        client.on('error', function (err) {
            setBanner('bad', '连接错误（自动重连中）');
            log('error', '连接错误：' + err.message);
        });
    }

    /* P1：统一消息路由 —— 校验规则全部来自 shared/protocol.js */
    function routeMessage(topic, message) {
        var raw = message.toString();
        var cls = P.classifyTopic(topic);

        if (cls.kind === P.KIND.UNKNOWN) {
            log('error', '未知 Topic，已忽略 | ' + topic + '（' + cls.reason + '）');
            return;
        }
        if (cls.kind !== P.KIND.ENV) {
            // fan / sim / focus 都是合法协议消息，本页不消费，也不记为故障
            log('info', '控制消息（' + cls.kind + '）已按协议接受 | ' + topic);
            return;
        }

        var result = P.validateEnvMessage(topic, raw);
        if (!result.ok) {
            log('error', result.message + ' | ' + topic);
            return;
        }
        var data = result.data;

        if (P.isStaleSeq(lastSeq[data.nodeId], data.seq)) {
            log('warn', '旧消息已丢弃 | ' + data.nodeId +
                ' | seq=' + data.seq + ' < 已记录 ' + lastSeq[data.nodeId]);
            return;
        }
        if (data.seq !== null) {
            lastSeq[data.nodeId] = data.seq;
        }

        var status = data.status;
        if (!data.statusValid) {
            status = calcStatus(data.temperature, data.humidity);
        }

        liveData[data.nodeId] = {
            temperature: data.temperature,
            humidity: data.humidity,
            status: status,
            time: data.time || formatStamp(new Date())
        };

        if (data.nodeId === currentNode) renderCard();
    }

    // 固定阈值规则统一来自 shared/protocol.js（本任务不改动规则）。
    // 任务 E3：status 由后端 Publisher 计算，前端正常路径直接使用后端值；
    // 此处仅在字段缺失/非法时兜底。
    var calcStatus = P.calcStatus;

    /* ============================================================
       渲染
       ============================================================ */
    function renderCard() {
        var d = liveData[currentNode];
        cardNodeEl.textContent = NODE_LABEL[currentNode];
        cardTempEl.textContent = d ? d.temperature.toFixed(1) : '--';
        cardHumidEl.textContent = d ? d.humidity.toFixed(1) : '--';
        cardStatusEl.textContent = d ? d.status : '等待数据';
        cardStatusEl.setAttribute('data-status', d ? d.status : '');
        if (cardTimeEl) cardTimeEl.textContent = '数据时间 ' + (d ? d.time : '—');
    }

    function selectNode(nodeId) {
        currentNode = nodeId;
        Array.prototype.forEach.call(nodeButtons, function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-node') === nodeId);
        });
        renderCard();
    }

    function renderSnapshots() {
        if (!snapshots.length) {
            snapListEl.innerHTML = '<div class="snap-empty">暂无快照记录</div>';
            return;
        }
        var html = '';
        snapshots.slice().reverse().forEach(function (s) {
            html += '<li>' +
                '<span class="sid">' + escapeHtml(s.nodeId) + '</span> · ' +
                escapeHtml(s.time) + '<br>' +
                '<span class="sdesc">' + escapeHtml(s.description) + '</span>' +
                '<br><span class="sdesc">文件：' + escapeHtml(s.filename || '—') + '</span>' +
                '</li>';
        });
        snapListEl.innerHTML = html;
    }

    function loadSnapshots() {
        try {
            var raw = window.localStorage.getItem(SNAP_KEY);
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
            return [];
        }
    }

    function saveSnapshots() {
        try {
            window.localStorage.setItem(SNAP_KEY, JSON.stringify(snapshots));
        } catch (err) {
            log('warn', '快照记录写入 localStorage 失败：' + err.message);
        }
    }

    /* ============================================================
       TTS：朗读当前选中节点的实时温湿度与状态
       ============================================================ */
    function buildSpeechText() {
        var d = liveData[currentNode];
        var label = NODE_LABEL[currentNode];
        if (!d) return label + '暂无数据。';
        return label + '：当前温度 ' + d.temperature.toFixed(1) + ' 摄氏度，湿度 ' +
            d.humidity.toFixed(1) + '%，状态' + d.status + '。';
    }

    function speak() {
        var text = buildSpeechText();
        if (!('speechSynthesis' in window)) {
            log('warn', '当前浏览器不支持语音合成');
            return text;
        }
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        log('ok', 'TTS 朗读：' + text);
        return text;
    }

    /* ============================================================
       Camera：拍照并与当前节点关联
       ============================================================ */
    function startCamera() {
        if (stream) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            log('error', '当前环境不支持摄像头（需要 localhost 或 https）');
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (s) {
                stream = s;
                video.srcObject = s;
                var p = video.play();
                if (p && typeof p.catch === 'function') p.catch(function () { /* 自动播放被拦截时忽略 */ });
                snapBtn.disabled = false;
                cameraBtn.textContent = '📷 摄像头已开启';
                log('ok', '摄像头已开启');
            })
            .catch(function (err) {
                log('error', '无法访问摄像头：' + err.message +
                    '（请用 http://localhost:8000/e2/index.html 打开本页）');
            });
    }

    function buildSnapshotDescription() {
        var d = liveData[currentNode];
        var label = NODE_LABEL[currentNode];
        if (!d) return label + ' · 暂无数据';
        return label + ' · ' + d.temperature.toFixed(1) + '℃/' +
            d.humidity.toFixed(1) + '% · ' + d.status;
    }

    function takeSnapshot() {
        if (!stream) {
            log('warn', '摄像头未开启，无法拍照');
            return null;
        }

        var w = video.videoWidth || 320;
        var h = video.videoHeight || 240;
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);

        var dataUrl = canvas.toDataURL('image/png');
        var now = new Date();
        var filename = 'snapshot_' + currentNode + '_' + fileStamp(now) + '.png';

        // 下载快照文件
        var link = document.createElement('a');
        link.href = dataUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // 记录快照元数据（与当前节点关联）
        var record = {
            nodeId: currentNode,
            time: formatStamp(now),
            description: buildSnapshotDescription(),
            filename: filename
        };
        snapshots.push(record);
        saveSnapshots();
        renderSnapshots();

        log('ok', '已保存快照 ' + filename + '（' + record.description + '）');
        return record;
    }

    /* ============================================================
       ASR：语音指令（三条业务指令）
       ============================================================ */
    function setHeard(text) { asrHeardEl.textContent = '最近识别：' + text; }

    /* ---------- ASR 状态机 ----------
       idle → starting → listening →（result 或 error）→ idle

       修掉的老问题：
         - start() 可以在已经启动时被再次调用，抛 InvalidStateError
         - onerror 设置的提示会被紧接着触发的 onend 立刻覆盖成"语音待机"，
           错误提示一闪而过，用户根本看不到
         - 不看 confidence，听错也照执行
         - 失败后状态卡住，无法重试
    */
    var ASR = {
        IDLE: 'idle', STARTING: 'starting', LISTENING: 'listening',
        ERROR: 'error', UNSUPPORTED: 'unsupported'
    };
    var ASR_LABEL = {
        idle: '语音待机',
        starting: '正在启动麦克风…',
        listening: '正在聆听…',
        error: '识别失败',
        unsupported: '不支持语音识别'
    };
    var ASR_BUTTON = {
        idle: '🎤 开始语音指令',
        starting: '🎤 启动中…',
        listening: '⏹ 停止语音指令',
        error: '🎤 重试语音指令',
        unsupported: '🎤 不支持语音识别'
    };
    // 低于该置信度时先征求确认，避免听错就直接执行
    var ASR_CONFIDENCE_MIN = 0.6;

    var asrState = ASR.IDLE;

    function setAsrState(state, hint) {
        asrState = state;
        asrBtn.textContent = ASR_BUTTON[state];
        asrBtn.classList.toggle('active', state === ASR.LISTENING);
        asrBtn.classList.toggle('error', state === ASR.ERROR);
        asrStatusEl.textContent = hint || ASR_LABEL[state];
        asrStatusEl.setAttribute('data-state', state);
        // 状态点与状态文字同一个来源，避免两处说法不一致
        if (asrStateBoxEl) asrStateBoxEl.setAttribute('data-state', state);
    }

    /** 把 SpeechRecognition 的错误码翻译成人能看懂的话 */
    function asrErrorText(code) {
        switch (code) {
            case 'not-allowed':
            case 'service-not-allowed':
                return '无麦克风权限，请在浏览器允许后重试';
            case 'no-speech':
                return '未听清，请再说一次';
            case 'audio-capture':
                return '找不到麦克风设备';
            case 'network':
                return '识别服务网络异常，请重试';
            case 'aborted':
                return '识别已取消';
            default:
                return '识别失败（' + code + '）';
        }
    }

    function initRecognition() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return null;

        var r = new SR();
        r.lang = 'zh-CN';
        r.continuous = false;
        r.interimResults = false;
        r.maxAlternatives = 1;

        r.onstart = function () {
            setAsrState(ASR.LISTENING);
        };

        r.onresult = function (e) {
            if (!e.results || !e.results[0] || !e.results[0][0]) {
                setAsrState(ASR.ERROR, '未听清，请再说一次');
                return;
            }
            var alt = e.results[0][0];
            var text = alt.transcript;
            // confidence 在部分浏览器上恒为 0，这种"拿不到"不等于"置信度低"
            var confidence = (typeof alt.confidence === 'number' && alt.confidence > 0)
                ? alt.confidence : null;

            setHeard(text + (confidence === null
                ? '' : '（置信度 ' + (confidence * 100).toFixed(0) + '%）'));

            if (confidence !== null && confidence < ASR_CONFIDENCE_MIN) {
                setAsrState(ASR.LISTENING, '没听太清（置信度 ' +
                    (confidence * 100).toFixed(0) + '%），请确认');
                log('warn', '识别置信度偏低：' + (confidence * 100).toFixed(0) + '%，等待确认');
                if (!window.confirm('没太听清，听到的是「' + text + '」，确定要执行吗？')) {
                    log('info', '用户取消了低置信度指令：' + text);
                    return;
                }
            }

            // 语音与按钮走的是同一个业务函数
            handleCommand(text);
        };

        r.onerror = function (e) {
            // 关键：这里设的提示不能被紧随其后的 onend 冲掉（由 onend 判断状态后保留）
            setAsrState(ASR.ERROR, asrErrorText(e.error));
            log('error', 'ASR 错误：' + e.error + ' — ' + asrErrorText(e.error));
        };

        r.onend = function () {
            if (asrState === ASR.ERROR) {
                // 出错就停在错误态（按钮显示"重试"），保留失败原因给用户看
                asrBtn.textContent = ASR_BUTTON.error;
                return;
            }
            setAsrState(ASR.IDLE);
        };

        return r;
    }

    function startAsr() {
        if (!recognition) recognition = initRecognition();
        if (!recognition) {
            setAsrState(ASR.UNSUPPORTED, '当前浏览器不支持语音识别，请使用下方按钮');
            log('warn', '当前浏览器不支持语音识别，请使用下方按钮');
            return;
        }
        // 只有确实没在跑的时候才 start，杜绝重复调用
        if (asrState === ASR.STARTING || asrState === ASR.LISTENING) return;

        setAsrState(ASR.STARTING);
        try {
            recognition.start();
            log('info', '已启动语音识别（可说：切换到宿舍A / 朗读状态 / 拍照）');
        } catch (err) {
            setAsrState(ASR.ERROR, '启动失败，请稍后重试');
            log('error', '启动语音识别失败：' + err.message);
        }
    }

    function stopAsr() {
        if (!recognition) return;
        try {
            recognition.stop();
        } catch (err) {
            /* 会话已经结束，忽略 */
        }
    }

    function toggleAsr() {
        if (asrState === ASR.UNSUPPORTED) return;
        if (asrState === ASR.STARTING || asrState === ASR.LISTENING) {
            stopAsr();
            return;
        }
        // idle / error 都走同一条启动路径，所以失败后直接再点一次即是重试
        startAsr();
    }

    /** 语音 / 按钮共用的指令分发入口 */
    function handleCommand(raw) {
        var source = String(raw == null ? '' : raw);
        var text = source.toLowerCase().replace(/\s+/g, '');
        if (!text) return null;

        if (source.indexOf('__') !== 0) {     // 内部调用不打日志，保持日志干净
            log('info', '收到指令：' + source);
        }

        // 指令一：切换宿舍节点
        for (var i = 0; i < NODES.length; i++) {
            if (matchNode(text, NODES[i])) {
                selectNode(NODES[i]);
                log('ok', '指令执行：切换到 ' + NODE_LABEL[NODES[i]]);
                return 'switch:' + NODES[i];
            }
        }

        // 指令二：朗读状态
        if (/朗读|播报|念一下|读一下|说说|说一下/.test(text)) {
            speak();
            return 'speak';
        }

        // 指令三：拍照
        if (/拍照|拍一张|拍个照|快照|保存现场|照片/.test(text)) {
            takeSnapshot();
            return 'snapshot';
        }

        log('warn', '未识别的指令：' + raw + '（可用：切换到宿舍A / 朗读状态 / 拍照）');
        return null;
    }

    function matchNode(text, node) {
        var letter = node.slice(-1);            // a / b / c
        return text.indexOf('宿舍' + letter) >= 0 ||
               text.indexOf(node) >= 0 ||
               text.indexOf('dorm' + letter) >= 0;
    }

    /* ============================================================
       事件绑定
       ============================================================ */
    Array.prototype.forEach.call(nodeButtons, function (btn) {
        btn.addEventListener('click', function () {
            selectNode(btn.getAttribute('data-node'));
            log('info', '手动切换到 ' + NODE_LABEL[currentNode]);
        });
    });

    asrBtn.addEventListener('click', toggleAsr);
    speakBtn.addEventListener('click', function () { speak(); });
    cameraBtn.addEventListener('click', startCamera);
    snapBtn.addEventListener('click', function () { takeSnapshot(); });
    clearSnapBtn.addEventListener('click', function () {
        snapshots = [];
        saveSnapshots();
        renderSnapshots();
        log('info', '已清空快照记录');
    });

    /* ============================================================
       供自动化验证读取 / 注入（不参与真实交互）
       ============================================================ */
    window.__e2 = {
        injectCommand: function (text) { setHeard(text); return handleCommand(text); },
        getCurrentNode: function () { return currentNode; },
        getSpeechText: buildSpeechText,
        getSnapshots: function () { return snapshots.slice(); },
        getCardText: function () {
            return cardNodeEl.textContent + ' ' + cardTempEl.textContent + '℃ / ' +
                cardHumidEl.textContent + '% / ' + cardStatusEl.textContent;
        },
        hasRecognitionSupport: function () {
            return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
        },
        // ASR 状态机的只读探针，供自动化验证断言状态流转
        getAsrState: function () { return asrState; },
        getAsrStatusText: function () { return asrStatusEl.textContent; },
        getAsrButtonText: function () { return asrBtn.textContent; }
    };

    /* ============================================================
       启动
       ============================================================ */
    selectNode('dorm-a');
    renderSnapshots();
    // 初始化 ASR 状态机：不支持语音识别的浏览器直接进入不支持态，
    // 但页面上的按钮仍可完成全部业务操作
    setAsrState(window.__e2.hasRecognitionSupport() ? ASR.IDLE : ASR.UNSUPPORTED);
    log('info', 'E2 页面已加载（ASR / TTS / Camera）');
    connect();
})();
</script>

</body>
</html>
